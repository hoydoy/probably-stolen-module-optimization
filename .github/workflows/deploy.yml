name: Deploy to GitHub Pages

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: './grid-optimizer/package-lock.json'
      - name: Install dependencies
        run: cd grid-optimizer && npm ci
      - name: Run tests
        run: cd grid-optimizer && npm test
      - name: Build the app
        run: cd grid-optimizer && npm run build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './grid-optimizer/dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
